      <p class="hint">Jobs show here when their Status on the job sheet is <b>Confirmed</b>. Saving the handover moves the job to In Progress.</p></div>`;
    return;
  }
  const names = STAFF.slice(); if(ho.rep && !names.includes(ho.rep)) names.unshift(ho.rep);
  const rep = STAFF.length
    ? '<label class="f">Layer By Layer representative<select data-h="rep"><option value="">Choose...</option>'+names.map(n=>'<option'+(n===ho.rep?" selected":"")+'>'+esc(n)+'</option>').join("")+'</select></label>'
    : hoField("rep","Layer By Layer representative",{ph:"Your name"});
  const has = x => ho.items.includes(x);
  const hasPrinterHo = !/^No printer/.test(ho.printer);
  const chipBox = (attr, val, on, label) => '<label class="chip"><input type="checkbox" '+attr+'="'+esc(val)+'"'+(on?" checked":"")+'>'+esc(label||val)+'</label>';
  const sigHtml = ho.signature
    ? '<div class="sigbox"><img src="'+ho.signature+'" alt="Customer signature"></div><div class="sigctl"><span>Signed</span><button type="button" class="mini" data-hosigclear="1">Clear and sign again</button></div>'
    : '<div class="sigbox"><canvas id="hoSig" aria-label="Customer signature pad"></canvas><span class="sighint">Customer signs here</span></div><div class="sigctl"><span>Draw with a finger, stylus or mouse</span></div>';

  p.innerHTML = `
    <div class="stage">
      <h2><span class="n">1</span>Job</h2>
      <div class="grid">
        ${pick}
        ${rep}
        ${hoField("date","Date of handover",{type:"date"})}
      </div>
      <h3 class="sub">How we received it</h3>
      <div class="chips" role="radiogroup" aria-label="How we received it">
        ${["Drop-off","Pick-up"].map(m=>'<label class="chip"><input type="radio" name="homethod" data-homethod="1" value="'+m+'"'+(ho.method===m?" checked":"")+'>'+(m==="Drop-off"?"Customer dropped off":"We picked up")+'</label>').join("")}
      </div>
      <div class="info summarycard">
        ${infoRow("Customer", ho.custName)}${infoRow("Contact", [ho.custContact, ho.custEmail].filter(Boolean).join(" · "))}
        ${infoRow("Printer", ho.printer)}${ho.mfms ? infoRow("MFMS", ho.mfms) : ""}
      </div>
      <p class="hint">Details come from the MDR Sheet. To change them, edit the Sheet, then press Refresh.</p>
    </div>

    <div class="stage">
      <h2><span class="n">2</span>Items handed over</h2>
      ${hasPrinterHo ? '<div class="grid one">'+hoField("nozzle","Nozzle installed",{ph:"e.g. 0.4 mm hardened steel", list:"dlNozzle"})+'</div>' : ""}
      <h3 class="sub">Accessories included</h3>
      <div class="chips">
        ${HO_ITEMS.filter(x => x !== "MFMS cable" || ho.mfms).map(x => chipBox("data-hoitem", x, has(x))).join("")}
        ${chipBox("data-hoother", "1", ho.otherOn, "Others")}
      </div>
      ${has("Build plate") ? '<div class="sub2">'+hoField("plateType","Build plate type",{ph:"e.g. Textured PEI", list:"dlPlate"})+'</div>' : ""}
      ${has("MFMS cable") ? '<div class="sub2"><span class="lab">MFMS cable pin type</span><div class="chips">'+["4 pin cable","6 pin cable"].map(x=>chipBox("data-hopin", x, ho.cablePins.includes(x))).join("")+'</div></div>' : ""}
      ${has("Filament") ? '<div class="sub2">'+hoField("filamentDetail","Filament type and amount",{ph:"e.g. PLA Basic black, about 500 g"})+'</div>' : ""}
      ${ho.otherOn ? '<div class="sub2">'+hoField("otherItems","Other items included",{type:"textarea",ph:"e.g. spare nozzle kit, tool box, original box"})+'</div>' : ""}
    </div>

    <div class="stage">
      <h2><span class="n">3</span>Condition at handover</h2>
      <div class="grid one">
        ${hoField("condition","Existing damage or marks",{type:"textarea",ph:"Scratches, cracks, missing or broken parts. Write “No visible damage” if none."})}
      </div>
      <h3 class="sub">Photos<small>${ho.photoUrls.length + hoPhotos.length} of ${HO_MAX_PHOTOS}</small></h3>
      <div class="photos">
        ${hoPhotos.map((ph,i)=>'<div class="ph"><img src="'+ph.dataUrl+'" alt="Handover photo '+(i+1)+'"><button type="button" data-hophotodel="'+i+'" aria-label="Remove photo '+(i+1)+'">&times;</button></div>').join("")}
        ${ho.photoUrls.length + hoPhotos.length < HO_MAX_PHOTOS ? '<label class="addph"><input type="file" accept="image/*" multiple data-hophotos="1">+ Add photos</label>' : ""}
      </div>
      ${ho.photoUrls.length ? '<p class="hint">'+ho.photoUrls.length+' photo'+(ho.photoUrls.length>1?"s":"")+' already saved to Drive.</p>' : ""}
    </div>

    <div class="stage">
      <h2><span class="n">4</span>Customer signature</h2>
      <p class="notice">${esc(HO_NOTICE)}</p>
      ${sigHtml}
    </div>

    <div class="stage">
      <h2><span class="n">5</span>Save &amp; send</h2>
      <p class="hint" style="margin:0 0 14px">Save after the customer signs. Saving moves the job to In Progress and fills the service report.</p>
      <div class="actions hoactions">
        <button type="button" class="primary" id="hoSave">${ho.saved ? "Save changes" : "Save handover"}</button>
        <button type="button" id="hoPdfBtn">Download PDF</button>
        <button type="button" id="hoWa" disabled title="Save first">Send on WhatsApp</button>
        <button type="button" id="hoMail" disabled title="Save first">Send by email</button>
      </div>
      <p class="hostatus" id="hoStatus" role="status" aria-live="polite"></p>
    </div>`;
  if(!ho.signature) initSigPad();
  hoSyncSend();
}
function hoField(key, label, opts){
  opts = opts || {};
  const v = ho[key] == null ? "" : ho[key];
  if(opts.type === "textarea")
    return '<label class="f">'+esc(label)+'<textarea data-h="'+key+'" placeholder="'+esc(opts.ph||"")+'">'+esc(v)+'</textarea></label>';
  return '<label class="f">'+esc(label)+'<input type="'+(opts.type||"text")+'" data-h="'+key+'"'+(opts.list?' list="'+opts.list+'"':"")+' placeholder="'+esc(opts.ph||"")+'" value="'+esc(v)+'"></label>';
}

// Signature pad: pointer events cover mouse, finger and stylus. Saved as a small PNG on lift.
function initSigPad(){
  const c = document.getElementById("hoSig");
  if(!c) return;
  const ratio = window.devicePixelRatio || 1, rect = c.getBoundingClientRect();
  c.width = rect.width * ratio; c.height = rect.height * ratio;
  const ctx = c.getContext("2d");
  ctx.scale(ratio, ratio); ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1F2421";
  let drawing = false;
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener("pointerdown", e => { drawing = true; c.setPointerCapture(e.pointerId); const [x,y] = pos(e); ctx.beginPath(); ctx.moveTo(x,y);
    c.parentNode.querySelector(".sighint").hidden = true; e.preventDefault(); });
  c.addEventListener("pointermove", e => { if(!drawing) return; const [x,y] = pos(e); ctx.lineTo(x,y); ctx.stroke(); });
  const end = () => {
    if(!drawing) return; drawing = false;
    // downscale to 600 px wide on white so it stays small enough for one Sheet cell
    const out = document.createElement("canvas"); out.width = 600; out.height = Math.round(600 * c.height / c.width);
    const o = out.getContext("2d"); o.fillStyle = "#fff"; o.fillRect(0, 0, out.width, out.height); o.drawImage(c, 0, 0, out.width, out.height);
    let url = out.toDataURL("image/png");
    if(url.length > 40000) url = out.toDataURL("image/jpeg", 0.7);
    ho.signature = url; hoMark();
  };
  c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
}

// Photos are shrunk on the device (longest side 1600 px) so uploads stay quick on mobile data.
function shrinkPhoto(file){
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error("Not an image")); };
    img.src = url;
  });
}

// The signed form as a PDF, for the customer and for Drive.
async function hoPdf(){
  const jsPDF = await loadJsPDF();
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const M = 16, R = 194, CW = R - M, INK = [31,36,33], MUTED = [92,99,107], GREEN = [62,107,31];
  let y = 16;
  const set = (size, style, color) => { doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor.apply(doc, color); };
  const need = h => { if(y + h > 280){ doc.addPage(); y = 16; } };
  const head = t => { need(14); y += 4; set(9, "bold", GREEN); doc.text(t.toUpperCase(), M, y); y += 2;
    doc.setDrawColor(226,229,224); doc.setLineWidth(0.3); doc.line(M, y, R, y); y += 5; };
  const row = (k, v) => {
    set(9.5, "normal", INK);
    const lines = doc.splitTextToSize(String(v || "-"), CW - 48);
    need(lines.length * 4.6 + 1.5);
    set(9, "normal", MUTED); doc.text(k, M, y);
    set(9.5, "normal", INK); doc.text(lines, M + 48, y);
    y += lines.length * 4.6 + 1.5;
  };
  const d = hoDerived(ho);

  const lh = 15;
  doc.addImage(LOGO, "PNG", M, y, lh * LOGO_RATIO, lh, "logo", "FAST");
  const tx = M + lh * LOGO_RATIO + 5;
  set(15, "bold", INK); doc.text("Handover & Takeover Form", tx, y + 6.5);
  set(8.6, "normal", MUTED); doc.text(SHOP_NAME + " · " + SHOP_CONTACT, tx, y + 12);
  set(8.6, "normal", MUTED); doc.text("Reference", R, y + 2.5, { align:"right" });
  set(11, "bold", INK); doc.text(ho.quoteNo, R, y + 8, { align:"right" });
  set(8.6, "normal", MUTED); doc.text(dmy(ho.date), R, y + 12.5, { align:"right" });
  y += lh + 4;
  doc.setDrawColor.apply(doc, INK); doc.setLineWidth(0.8); doc.line(M, y, R, y); y += 3;

  head("Parties");
  row("Customer", ho.custName); row("Contact number", ho.custContact);
  row("Representative", ho.rep + ", " + SHOP_NAME);
  row("Received by", ho.method === "Pick-up" ? "Pick-up by Layer By Layer" : "Drop-off by customer");
  row("Date of handover", dmy(ho.date));
  head("Printer details");
  row("Printer", ho.printer); if(ho.mfms) row("MFMS", ho.mfms);
  if(!/^No printer/.test(ho.printer)) row("Nozzle installed", ho.nozzle || "Not recorded");
  head("Items handed over");
  row("Accessories", d.items.length ? d.items.join("\n") : "None");
  head("Condition at handover");
  row("Existing damage", ho.condition || "Not recorded");
  const nPh = ho.photoUrls.length + hoPhotos.length;
  row("Photos", nPh ? nPh + " photo" + (nPh > 1 ? "s" : "") + " taken at handover, kept on file by Layer By Layer" : "None taken");

  // acknowledgement + signature
  set(8.6, "normal", INK);
  const nl = doc.splitTextToSize(HO_NOTICE, CW - 10);
  const nh = nl.length * 4 + 7;
  need(nh + 60); y += 4;
  doc.setFillColor(242,243,241); doc.setDrawColor(199,206,194); doc.setLineWidth(0.3);
  doc.roundedRect(M, y, CW, nh, 2, 2, "FD");
  doc.text(nl, M + 5, y + 5.5); y += nh + 8;
  set(9, "bold", GREEN); doc.text("CUSTOMER SIGNATURE", M, y); y += 3;
  if(ho.signature){
    const fmt = ho.signature.indexOf("image/jpeg") > 0 ? "JPEG" : "PNG";
    const props = doc.getImageProperties(ho.signature);
    const w = 70, h = Math.min(30, w * props.height / props.width);
    doc.addImage(ho.signature, fmt, M, y, w, h, "sig", "FAST"); y += h + 1;
  } else y += 22;
  doc.setDrawColor(150,156,150); doc.setLineWidth(0.3); doc.line(M, y, M + 80, y); y += 4.5;
  set(9, "normal", INK); doc.text(ho.custName || "Customer", M, y);
  set(8.6, "normal", MUTED); doc.text("Date: " + dmy(ho.date), M + 80, y, { align:"right" });

  const pages = doc.internal.getNumberOfPages();
  for(let i = 1; i <= pages; i++){
    doc.setPage(i); set(7.8, "normal", MUTED);
    doc.text(SHOP_NAME + " · Handover / Takeover Form · " + ho.quoteNo + ". Retain a copy for your records.", M, 289);
    doc.text("Page " + i + " of " + pages, R, 289, { align:"right" });
  }
  const safe = t => String(t||"").replace(/[^A-Za-z0-9-_]+/g,"-").replace(/^-|-$/g,"");
  return new File([doc.output("blob")], [safe(ho.quoteNo), "Handover", safe(ho.custName)].filter(Boolean).join("_") + ".pdf", { type:"application/pdf" });
}
const fileToBase64 = f => new Promise((ok, fail) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1]); fr.onerror = fail; fr.readAsDataURL(f); });

function hoStatus(kind, msg){ const el = document.getElementById("hoStatus"); if(el){ el.className = "hostatus " + kind; el.textContent = msg; } }
async function saveHo(b){
  const missing = [];
  if(!ho.rep) missing.push("representative");
  if(!ho.date) missing.push("date of handover");
  if(!ho.method) missing.push("how we received it");
  if(!ho.signature) missing.push("customer signature");
  if(missing.length){ hoStatus("err", "Still needed: " + missing.join(", ") + "."); return; }
  b.disabled = true; b.textContent = "Saving...";
  hoStatus("busy", "Saving the handover to the Sheet and Drive...");
  try{
    const file = await hoPdf();
    const d = hoDerived(ho);
    const h = Object.assign({}, ho, d); delete h.signature; delete h.saved; delete h.pdfUrl;
    const out = await callSheet({ action:"handover", handover:h, signature: ho.signature,
      photos: hoPhotos.map(p => ({ base64: p.dataUrl.split(",")[1] })), pdf: { name: file.name, base64: await fileToBase64(file) } });
    if(out.result !== "success"){
      if(out.message === "Wrong password."){ lock("Password changed. Log in again, then save again."); return; }
      hoStatus("err", "NOT saved: " + out.message); return;
    }
    ho.photoUrls = out.photoUrls || ho.photoUrls; hoPhotos = []; ho.saved = true; hoDirty = false; hoFile = file;
    const q = ho.quoteNo;
    try{ await loadJobs(); render(); }catch(e){}
    renderHo();
    hoStatus("ok", "Saved." + (out.movedToInProgress ? " " + q + " is now In Progress and ready for its service report." : "") +
      (out.pdfUrl ? " Signed PDF saved to Drive." : " (PDF copy NOT saved to Drive.)"));
  }catch(err){ console.error(err); hoStatus("err", "NOT saved (no connection?). Try again."); }
  finally{ const s = document.getElementById("hoSave"); if(s){ s.disabled = false; s.textContent = ho.saved ? "Save changes" : "Save handover"; } }
}

// Handover email / WhatsApp wording. Same placeholders as the report email.
const HO_EMAIL_SUBJECT = "Your printer handover form for {quote} | Layer By Layer";
const HO_EMAIL_BODY = `Hi {name},

Thank you for entrusting your {machine} to Layer By Layer. Attached is the signed handover form (reference: {quote}), listing the items we received and the condition of the printer at handover.

Please keep it for your records. We will update you once the service is complete. If you have any questions, just reply to this email or WhatsApp us at +65 8986 7382.

Best regards,
{specialist}
Layer By Layer`;
function hoFill(t){
  const vals = { name: ho.custName || "there", quote: ho.quoteNo, specialist: ho.rep || "The Layer By Layer team",
    machine: [/^No printer/.test(ho.printer) ? "" : ho.printer, ho.mfms].filter(Boolean).join(" and ") || "3D printer" };
  return t.replace(/\{(name|quote|machine|specialist)\}/g, (m, k) => vals[k]);
}

function setMode(m){
  const isHo = m === "ho";
  document.body.classList.toggle("mode-ho", isHo);
  document.getElementById("modeReport").setAttribute("aria-pressed", String(!isHo));
  document.getElementById("modeHo").setAttribute("aria-pressed", String(isHo));
  if(isHo) renderHo();
  scrollTo(0, 0);
}
document.getElementById("modeReport").addEventListener("click", () => setMode("report"));
document.getElementById("modeHo").addEventListener("click", () => setMode("ho"));

const hoPane = document.getElementById("hoPane");
hoPane.addEventListener("change", async e => {
  const t = e.target;
  if(t.dataset.hopick !== undefined){
    if(!t.value) return;
    if(hoDirty && t.value !== ho.quoteNo && !confirm("Open " + t.value + "? Unsaved handover changes will be lost.")){ renderHo(); return; }
    try{ await loadJobs(); }catch(err){}
    const j = JOBS.find(x => x.quoteNo === t.value);
    if(j) openHo(j); else { toast(t.value + " is no longer on the list."); renderHo(); }
    return;
  }
  if(t.dataset.homethod){ ho.method = t.value; hoMark(); return; }
  if(t.dataset.hoitem){ const i = ho.items.indexOf(t.dataset.hoitem); if(t.checked && i < 0) ho.items.push(t.dataset.hoitem); if(!t.checked && i >= 0) ho.items.splice(i, 1); hoMark(); renderHo(); return; }
  if(t.dataset.hoother){ ho.otherOn = t.checked; hoMark(); renderHo(); return; }
  if(t.dataset.hopin){ const i = ho.cablePins.indexOf(t.dataset.hopin); if(t.checked && i < 0) ho.cablePins.push(t.dataset.hopin); if(!t.checked && i >= 0) ho.cablePins.splice(i, 1); hoMark(); return; }
  if(t.dataset.hophotos){
    const room = HO_MAX_PHOTOS - ho.photoUrls.length - hoPhotos.length;
    const files = Array.from(t.files || []).slice(0, room);
    for(const f of files){ try{ hoPhotos.push({ name: f.name, dataUrl: await shrinkPhoto(f) }); }catch(err){ toast(f.name + " is not a photo."); } }
    if((t.files || []).length > room) toast("Only " + HO_MAX_PHOTOS + " photos per handover.");
    hoMark(); renderHo(); return;
  }
  if(t.dataset.h === "rep"){ try{ localStorage.setItem(SPECIALIST_KEY, t.value); }catch(err){} }
});
hoPane.addEventListener("input", e => { const t = e.target; if(t.dataset.h){ ho[t.dataset.h] = t.value; hoMark(); } });
hoPane.addEventListener("click", e => {
  const t = e.target.closest("button");
  if(!t) return;
  if(t.dataset.horefresh){ loadJobs().then(() => { const j = JOBS.find(x => x.quoteNo === ho.quoteNo); if(j && !hoDirty) openHo(j); else renderHo(); }); return; }
  if(t.dataset.hosigclear){ ho.signature = ""; hoMark(); renderHo(); return; }
  if(t.dataset.hophotodel !== undefined){ hoPhotos.splice(+t.dataset.hophotodel, 1); hoMark(); renderHo(); return; }
  if(t.id === "hoSave"){ saveHo(t); return; }
  if(t.id === "hoPdfBtn"){
    t.disabled = true;
    hoPdf().then(saveFileLocally).catch(err => { console.error(err); toast("PDF could not be built."); }).finally(() => { t.disabled = false; });
    return;
  }
  if(t.id === "hoWa"){ if(hoFile) shareOrChat(hoFile, hoFill("Hi {name}, here is your signed Layer By Layer handover form for {quote}. We will update you once the service is complete. Thank you!"), ho.custContact, e.shiftKey); return; }
  if(t.id === "hoMail"){
    if(!hoFile) return;
    openMail({ to: ho.custEmail, subject: hoFill(HO_EMAIL_SUBJECT), body: hoFill(HO_EMAIL_BODY), file: hoFile,
      extra: { kind:"handover", quoteNo: ho.quoteNo, tech: ho.rep }, done: "Handover form emailed to " });
  }
});

/* ---------- boot ---------- */
(async function(){
  document.getElementById("barLogo").src = LOGO;
  document.getElementById("gateLogo").src = LOGO;
  render();
  try{ localStorage.removeItem(PIN_KEY); }catch(e){} // forget passwords older versions remembered
  // A refresh logs out, so warn before throwing away an unsaved report.
  window.addEventListener("beforeunload", e=>{ if(dirty || hoDirty){ e.preventDefault(); e.returnValue = ""; } });
})();
</script>
